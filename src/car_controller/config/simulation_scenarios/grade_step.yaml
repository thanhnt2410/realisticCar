# grade_step scenario: stepped road grade to test disturbance rejection.
# Grade profile: 0% -> +5% -> 0% -> -5% -> 0% (switched externally by runner).
# No sensor/process noise so grade disturbance is isolated.
longitudinal_vehicle_simulator_node:
  ros__parameters:
    actuator_delay_s: 0.1
    actuator_lag_tau_s: 0.15
    max_accel: 3.0
    min_accel: -3.0
    max_jerk: 5.0
    min_jerk: -5.0
    # Starting grade (runner will override dynamically).
    grade_percent: 0.0
    rolling_resistance_coeff: 0.01
    drag_coeff: 0.35575
    mass_kg: 1423.0
    gravity: 9.81
    velocity_noise_sigma: 0.0
    process_noise_sigma: 0.0
    random_seed: 1001
    step_rate_hz: 50.0
