# sensor_noise scenario: velocity sensor noise + optional process noise.
# Run minimum 10 paired seeds (1001..1010).
longitudinal_vehicle_simulator_node:
  ros__parameters:
    actuator_delay_s: 0.1
    actuator_lag_tau_s: 0.15
    max_accel: 3.0
    min_accel: -3.0
    max_jerk: 5.0
    min_jerk: -5.0
    grade_percent: 0.0
    rolling_resistance_coeff: 0.01
    drag_coeff: 0.35575
    mass_kg: 1423.0
    gravity: 9.81
    velocity_noise_sigma: 0.05      # [m/s] sensor noise std-dev
    process_noise_sigma: 0.05       # [m/s^2] process noise std-dev
    random_seed: 1001               # overridden by runner per paired run
    step_rate_hz: 50.0

# Gazebo effort backend: add noise only to controller feedback. Ground-truth
# odometry remains noise-free for evaluation in velocity_logger.
odometry_adapter:
  ros__parameters:
    velocity_noise_sigma: 0.05      # [m/s]
    random_seed: 1001               # overridden by runner per paired run
