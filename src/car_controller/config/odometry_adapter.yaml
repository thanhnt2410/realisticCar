odometry_adapter:
  ros__parameters:
    use_sim_time: true
    input_topic: /simulation/gazebo_odometry
    twist_frame: body
    # Gazebo's odometry publisher reports the model-forward component on X.
    body_longitudinal_axis: "x"
    body_longitudinal_sign: 1.0
    velocity_noise_sigma: 0.0
    random_seed: 1001
