trapezoid_velocity_profile_node:
  ros__parameters:
    # New topic: publishes LongitudinalReference (v_ref + a_ref + jerk_ref).
    longitudinal_reference_topic: /planning/longitudinal_reference

    velocity_points: [0.0, 12.0, 7.0, 17.0, 8.0, 0.0]

    # Jerk-limited S-curve. Acceleration rises linearly for
    # acceleration_ramp_duration, remains constant, then returns to zero over
    # the same duration. The 0 -> 12 m/s segment has a_peak=2.4 m/s^2 and
    # |jerk|=2.4 m/s^3 with these settings. Ramp + hold remains 9 s, so the
    # complete profile duration remains 45 s.
    ramp_duration: 6.0
    acceleration_ramp_duration: 1.0
    hold_duration: 3.0
    publish_rate: 50.0
    # Stop advancing the profile and hold its final value.
    loop: false
